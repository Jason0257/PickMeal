const GA_RESERVED = ['session_start','first_visit','first_open','user_engagement','error','in_app_purchase','app_update','os_update'];
const DB_WRITE = !['localhost', '127.0.0.1', ''].includes(location.hostname);
async function track(event_type, fields = {}) {
    const row = eventRow(event_type, fields);

    // 로컬(localhost / file://)에서는 GA4 · Supabase 어느 쪽에도 보내지 않는다
    if (!DB_WRITE) {
        console.log('[PickMeal dry-run]', event_type, row);
        return;
    }

    // =========================
    // Google Analytics 4
    // =========================
    if (typeof gtag === 'function') {
        const gaFields = { ...fields };
        if (Array.isArray(gaFields.recommendation_set)) {
            gaFields.recommendation_names = gaFields.recommendation_set.map(m => m.name).join(', ');
            delete gaFields.recommendation_set; // 배열 데이터는 GA4에서 전송 제외
        }
        // GA4 예약 이벤트명은 커스텀 전송이 무시되므로 접두어를 붙인다.
        // Supabase 에 저장되는 event_type 은 원래 이름 그대로다.
        gtag('event', GA_RESERVED.includes(event_type) ? 'pm_' + event_type : event_type, gaFields);
    }

    // =========================
    // Supabase
    // =========================

    try {
        const { error } = await _supabase
            .from('pickmeal_events')
            .insert([row]);

        if (error) throw error;
    } catch (error) {
        console.error('PickMeal event logging failed:', error);
    }
}
function newSessionId(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
document.querySelector('#start').addEventListener('click',()=>{analytics.sessionId=newSessionId();analytics.startAt=Date.now();analytics.setNo=0;analytics.rerollCount=0;track('session_start')},{capture:true});
document.querySelector('#recommend').addEventListener('click',()=>{if(!conditionsReady())return;const key=state.c+'|'+state.m+'|'+state.b;if(key===lastSubmitted)return;lastSubmitted=key;track('condition_submit',{companion:state.c,mood:state.m,budget:state.b})},{capture:true});


document.addEventListener('click',event=>{const reason=event.target.closest('.reason');if(reason){analytics.rerollCount+=1;track('reroll',{reroll_reason:reason.textContent,reroll_set_no:analytics.setNo})}const completeButton=event.target.closest('#complete');if(completeButton&&chosen&&analytics.startAt){track('menu_selected',{selected_menu:chosen.name,decision_sec:Math.round((Date.now()-analytics.startAt)/1000),reroll_count:analytics.rerollCount})}const feedbackButton=event.target.closest('.feedback:not(.reason)');if(feedbackButton){track('feedback_submit', {
    feedback: feedbackButton.dataset.f === '만족' ? 1 : 0
});}},{capture:true});
document.querySelector('#recommend').onclick=requestRecommendation;
document.addEventListener('click',event=>{if(!event.target.closest('#close'))return;const start=document.querySelector('#start-screen');start.classList.remove('screen-out');start.classList.add('screen-in')},{capture:true});
</script></body></html>
