const state={c:null,m:null,b:'any'},cards=document.querySelector('#cards'),modal=document.querySelector('#modal'),modalContent=document.querySelector('#modal-content');let shown=[],seen=[],exhausted=false,chosen,hasRecommended=false,lastSubmitted=null;

async function track(event_type, fields = {}) {
    const row = eventRow(event_type, fields);
    if (!DB_WRITE) { console.log('[PickMeal dry-run]', row); return; }

        const { error } = await _supabase
            .from('pickmeal_events')
            .insert([row]);
